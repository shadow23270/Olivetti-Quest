<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ITS Olivetti Quest</title>
<meta name="theme-color" content="#060b26" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <span class="brand">
      <img class="brand-logo" src="assets/logo-its-olivetti-bianco.svg" alt="ITS Academy Adriano Olivetti" />
    </span>
    <span class="site-header-right">
      <span class="brand-game">Olivetti Quest</span>
      <button type="button" class="fullscreen-btn" id="fullscreen-btn">Schermo intero</button>
      <a href="admin.html" class="admin-link" title="Pannello admin (organizzatori)" aria-label="Pannello admin"></a>
    </span>
  </header>
  <main class="cabinet">
    <div class="card-hero">
      <span class="eyebrow">Il gioco dei corsi ITS</span>
      <h1 class="title">Olivetti Quest</h1>
      <p class="subtitle">Scopri i corsi ITS giocando: 5 livelli, 21 corsi e 4 minigiochi.</p>
    </div>

    <form id="start-form" autocomplete="off">
      <label class="field-label" for="team-name">Nome della squadra</label>
      <input
        type="text"
        id="team-name"
        maxlength="24"
        placeholder="Es. I Pixel Furiosi"
        required
        autofocus
      />
      <p class="error-msg" id="error-msg" aria-live="polite"></p>
      <button type="submit" class="btn-arcade" id="start-btn">Inizia</button>
    </form>

    <div class="link-row mt-16">
      <a href="leaderboard.html" class="btn-arcade secondary">Classifica di oggi</a>
    </div>
  </main>

  <script src="js/profanity.js"></script>
  <script src="js/app.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/header.js"></script>
</body>
</html>
